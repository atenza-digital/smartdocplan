# docker-compose.yml para producao com Traefik (SSL automatico via Let's Encrypt)
# Imagem pre-compilada via GitHub Actions: ghcr.io/atenza-digital/smartdocplan:latest

services:
  app:
    image: ghcr.io/atenza-digital/smartdocplan:latest
    container_name: smartdocplan-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - smartdocplan_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.smartdocplan.rule=Host(`srv1450720.hstgr.cloud`)"
      - "traefik.http.routers.smartdocplan.entrypoints=websecure"
      - "traefik.http.routers.smartdocplan.tls=true"
      - "traefik.http.routers.smartdocplan.tls.certresolver=letsencrypt"
      - "traefik.http.services.smartdocplan.loadbalancer.server.port=5000"
      - "traefik.docker.network=smartdocplan_net"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/trpc/system.health?input=%7B%22timestamp%22%3A0%7D"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  smartdocplan_net:
    external: true
    name: smartdocplan_net
