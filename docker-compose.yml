# docker-compose.yml para produção com Traefik (SSL automático via Let's Encrypt)
# Imagem publicada via GitHub Actions e consumida pelo deploy automatizado

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/atenza-digital/smartdocplan:latest}
    container_name: smartdocplan-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${APP_PORT:-5000}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_HOST_PORT:-5000}:${APP_PORT:-5000}"
    networks:
      - smartdocplan_net
      - database_net
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-true}"
      - "traefik.http.routers.smartdocplan.rule=Host(`${APP_HOST:-srv1450720.hstgr.cloud}`)"
      - "traefik.http.routers.smartdocplan.entrypoints=${TRAEFIK_ENTRYPOINTS:-websecure}"
      - "traefik.http.routers.smartdocplan.tls=true"
      - "traefik.http.routers.smartdocplan.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.smartdocplan.loadbalancer.server.port=${APP_PORT:-5000}"
      - "traefik.docker.network=${TRAEFIK_DOCKER_NETWORK:-smartdocplan_net}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${APP_PORT:-5000}/api/trpc/system.health?input=%7B%22json%22%3A%7B%22timestamp%22%3A0%7D%7D"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

networks:
  smartdocplan_net:
    external: true
    name: ${TRAEFIK_DOCKER_NETWORK:-smartdocplan_net}
  database_net:
    external: true
    name: ${DB_DOCKER_NETWORK:-postgresql-evkn_default}
