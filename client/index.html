<!doctype html>
<html lang="pt-BR">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>SmartDocPlan - Gestão Documental de SST</title>
    <meta name="description" content="Plataforma de gestão documental para Saúde e Segurança no Trabalho" />
    <!-- vLibras - Acessibilidade em Libras (Gov.br) -->
    <script>
      window.vlibras = { settings: { VLibras: { engage: true, rootPath: 'https://vlibras.gov.br/app' } } };
    </script>
  </head>

  <body>
    <!-- vLibras widget container -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      try { new window.VLibras.Widget('https://vlibras.gov.br/app'); } catch(e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
